name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM built by Gluon
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Build Android package
        run: ./mvnw -Pandroid gluonfx:build gluonfx:package

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            target/gluonfx/aarch64-android/gvm/*.apk
            target/gluonfx/aarch64-android/gvm/*.aab
